<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulso | Buzos</title>

  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header></header>

  <main class="contenedor">
    <section class="category-section">

      <div class="category-hero">
        <div class="category-info">
          <span class="section-tag">EXCLUSIVE</span>
          <h1 class="category-title">Buzos</h1>
          <p class="category-text">
            Explorá nuestra selección de buzos streetwear de Pulso.
            Estilos, comodidad y actitud en una misma colección.
          </p>
        </div>

        <div class="category-featured">
          <article class="featured-card featured-main">
            <img src="../img/buzos/buzo_detalle_1.webp" alt="Detalle de buzo">
          </article>

          <article class="featured-card featured-secondary">
            <img src="../img/buzos/buzo_detalle_2.webp" alt="Detalle de buzo">
          </article>

          <article class="featured-card featured-secondary">
            <img src="../img/buzos/buzo_detalle_3.webp" alt="Detalle de buzo">
          </article>
        </div>
      </div>

      <div class="category-grid-section">
        <div class="section-head">
          <h2>SS'26</h2>
          <a href="#" class="ver-todas">img</a>
        </div>

        <div class="productos-grid">

          <article class="producto-card" data-nombre="Buzo Mandi" data-precio="35000" data-precio-texto="$35.000"
            data-descripcion="Buzo streetwear cómodo, con diseño relajado, textura suave y estilo urbano para uso diario. Ideal para combinar con outfits casuales y modernos.">

            <div class="producto-slider">
              <img src="../img/buzos/buzo_naranja_1.webp" alt="Buzo Mandi">
              <img src="../img/buzos/buzo_naranja_2.webp" alt="Buzo Mandi">
              <img src="../img/buzos/buzo_naranja_3.webp" alt="Buzo Mandi">
            </div>

            <h3>Buzo Mandi</h3>
            <p>$35.000</p>

            <div class="producto-acciones">
              <button class="btn-cantidad btn-restar" type="button">-</button>
              <span class="cantidad-producto">0</span>
              <button class="btn-cantidad btn-sumar" type="button">+</button>
              <button class="btn-carrito" type="button" aria-label="Agregar al carrito">🛒</button>
            </div>
          </article>

          <article class="producto-card" data-nombre="Buzo Ocean" data-precio="34000" data-precio-texto="$34.000"
            data-descripcion="Buzo azul de estilo urbano, cómodo y versátil. Pensado para looks relajados, con una estética moderna y fácil de combinar.">

            <div class="producto-slider">
              <img src="../img/buzos/buzo_azul_1.webp" alt="Buzo Ocean">
              <img src="../img/buzos/buzo_azul_2.webp" alt="Buzo Ocean">
              <img src="../img/buzos/buzo_azul_3.webp" alt="Buzo Ocean">
            </div>

            <h3>Buzo Ocean</h3>
            <p>$34.000</p>

            <div class="producto-acciones">
              <button class="btn-cantidad btn-restar" type="button">-</button>
              <span class="cantidad-producto">0</span>
              <button class="btn-cantidad btn-sumar" type="button">+</button>
              <button class="btn-carrito" type="button" aria-label="Agregar al carrito">🛒</button>
            </div>
          </article>

          <article class="producto-card" data-nombre="Buzo Dark" data-precio="46000" data-precio-texto="$46.000"
            data-descripcion="Buzo negro con estética streetwear, diseño limpio y gran versatilidad. Una prenda clave para outfits urbanos de temporada.">

            <div class="producto-slider">
              <img src="../img/buzos/buzo_negro_1.webp" alt="Buzo Dark">
              <img src="../img/buzos/buzo_negro_2.webp" alt="Buzo Dark">
              <img src="../img/buzos/buzo_negro_3.webp" alt="Buzo Dark">
            </div>

            <h3>Buzo Dark</h3>
            <p>$46.000</p>

            <div class="producto-acciones">
              <button class="btn-cantidad btn-restar" type="button">-</button>
              <span class="cantidad-producto">0</span>
              <button class="btn-cantidad btn-sumar" type="button">+</button>
              <button class="btn-carrito" type="button" aria-label="Agregar al carrito">🛒</button>
            </div>
          </article>

          <article class="producto-card" data-nombre="Buzo Glow" data-precio="50000" data-precio-texto="$50.000"
            data-descripcion="Buzo verde con diseño moderno, cómodo y con personalidad visual. Ideal para destacar dentro de una propuesta streetwear.">

            <div class="producto-slider">
              <img src="../img/buzos/buzo_verde_1.webp" alt="Buzo Glow">
              <img src="../img/buzos/buzo_verde_2.webp" alt="Buzo Glow">
              <img src="../img/buzos/buzo_verde_3.webp" alt="Buzo Glow">
            </div>

            <h3>Buzo Glow</h3>
            <p>$50.000</p>

            <div class="producto-acciones">
              <button class="btn-cantidad btn-restar" type="button">-</button>
              <span class="cantidad-producto">0</span>
              <button class="btn-cantidad btn-sumar" type="button">+</button>
              <button class="btn-carrito" type="button" aria-label="Agregar al carrito">🛒</button>
            </div>
          </article>

        </div>
      </div>

    </section>
  </main>

  <div class="producto-modal" id="productoModal">
    <div class="modal-contenido">
      <button class="modal-cerrar" id="cerrarModal" type="button">×</button>

      <div class="modal-slider" id="modalSlider"></div>
      <div class="modal-info">
        <h2 id="modalTitulo"></h2>
        <p id="modalDescripcion"></p>
        <strong id="modalPrecio"></strong>

        <div class="modal-acciones">
          <div class="modal-cantidad-box">
            <button class="btn-cantidad modal-control-btn" id="modalRestar" type="button">-</button>
            <span class="cantidad-producto modal-cantidad-numero" id="modalCantidad">0</span>
            <button class="btn-cantidad modal-control-btn" id="modalSumar" type="button">+</button>
          </div>

          <button class="btn-carrito modal-btn-carrito" id="modalAgregarCarrito" type="button">
            🛒 Agregar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/productos.js"></script>

</body>

</html>
