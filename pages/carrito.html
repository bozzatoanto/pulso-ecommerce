<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulso | Carrito</title>

  <link rel="icon" href="../img/icono.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header></header>

  <main class="contenedor carrito-page">
    <section class="carrito-header">
      <span class="section-tag">TU SELECCIÓN</span>
      <h1>Carrito</h1>
      <p>Revisá tus productos antes de finalizar la compra.</p>
    </section>

    <section class="carrito-layout">
      <div class="carrito-listado" id="carritoContenedor"></div>

      <aside class="carrito-sidebar">
        <div class="carrito-resumen-card">
          <span class="carrito-resumen-tag">Resumen</span>
          <h2>Tu compra</h2>

          <div class="carrito-resumen-linea">
            <span>Productos</span>
            <strong id="cantidadProductos">0</strong>
          </div>

          <div class="carrito-resumen-linea total">
            <span>Total</span>
            <strong id="carritoTotal">$0</strong>
          </div>

          <div class="carrito-resumen-acciones">
            <a href="../index.html" class="btn-seguir-comprando">Seguir comprando</a>
            <button type="button" class="btn-finalizar-compra" id="btnFinalizarCompra">
              Finalizar compra
            </button>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script type="module" src="../js/data.js"></script>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module" src="../js/carrito.js"></script>
</body>

</html>
