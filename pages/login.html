<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulso | Login</title>

  <link rel="icon" href="../img/icono.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header></header>

  <main class="auth-main">
    <section class="auth-card auth-card-login">

      <h1>Login</h1>

      <p class="auth-subtitle">
        Accedé a tu cuenta para ver precios, guardar productos y comprar.
      </p>

      <form action="#" method="post" class="auth-form" id="loginForm">

        <label for="email">Email</label>

        <div class="auth-input">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>

          <input type="email" id="email" name="email" placeholder="e-mail address" required>
        </div>

        <label for="password">Contraseña</label>

        <div class="auth-input auth-input-password">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M3 3l18 18"></path>
            </svg>
          </span>

          <input type="password" id="password" name="password" placeholder="password" required>
        </div>

        <div class="auth-extra">
          <a href="#" class="forgot-link">Olvidé mi contraseña</a>
        </div>

        <button type="submit" class="auth-submit auth-submit-full">
          <span>Iniciar sesión</span>
        </button>
      </form>

      <p class="auth-footer-link">
        <a href="registro.html">¿No tenés cuenta? Registrate</a>
      </p>

    </section>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>

</body>

</html>
