<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulso | Registro</title>

  <link rel="icon" href="../img/icono.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header></header>

  <main class="auth-main">
    <section class="auth-card auth-card-register">

      <h1>Crear cuenta</h1>

      <p class="auth-subtitle">
        Registrate para ver precios, guardar productos y acceder al carrito.
      </p>

      <form action="#" method="post" class="auth-form" id="registroForm">

        <label for="nombre">Nombre</label>

        <div class="auth-input">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>

          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <label for="apellido">Apellido</label>

        <div class="auth-input">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9.5" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </span>

          <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>
        </div>

        <label for="email">Email</label>

        <div class="auth-input">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path>
              <path d="m22 6-10 7L2 6"></path>
            </svg>
          </span>

          <input type="email" id="email" name="email" placeholder="e-mail address" required>
        </div>

        <label for="password">Contraseña</label>

        <div class="auth-input">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M3 3l18 18"></path>
            </svg>
          </span>

          <input type="password" id="password" name="password" placeholder="password" required>
        </div>

        <label for="fecha">Fecha de nacimiento</label>

        <div class="auth-input">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <path d="M16 2v4"></path>
              <path d="M8 2v4"></path>
              <path d="M3 10h18"></path>
            </svg>
          </span>

          <input type="date" id="fecha" name="fecha" required>
        </div>

        <button type="submit" class="auth-submit auth-submit-full">
          <span>Crear cuenta</span>
        </button>

      </form>

      <p class="auth-footer-link">
        <a href="login.html">¿Ya tenés cuenta? Iniciá sesión</a>
      </p>

    </section>
  </main>

<script type="module" src="../js/data.js"></script>
<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/navbar.js"></script>

</body>

</html>
